name: "KBOT-CICD"

on: "push"

jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"
        with:
          fetch-depth: 0

      - name: "Run test"
        run: "make test"

      - name: "Log in to registry"
        run: "echo \"${{ secrets.GHCR_TOKEN }}\" | docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: "Build&Push"
        env:
          TARGET_ARCH: "amd64"
        run: "make image push"